# Policy for the stock `mcp-automem` server (tools discovered at runtime). AutoMem has one service token and no
# tenancy, so namespaces are enforced here: forced tags on store, scoped tags and a response filter on recall,
# ownership checks on associate. delete_memory and update_memory are never exported to agents or owners
# through the broker (tools_deny); use the memory service directly for those.
connector: memory
version: 2
adapter_version: "2.0"
tools_deny: [delete_memory, update_memory]
operations:
  - id: memory.store
    tool: store_memory
    risk: reversible
    requires_capability: operations:store
    constraints: [namespaces, store_per_run, max_importance, calls_per_run]
    guards: [single_memory_only]
    compact: { fields: [memory_id, status] }
  - id: memory.recall
    tool: recall_memory
    risk: read
    requires_capability: operations:recall
    constraints: [namespaces, calls_per_run]
    guards: [scoped_recall]          # exact tag match, expansion respects tags, no scope fallback, no id fetch
    response: [namespace_filter]     # drop any result whose record lacks a namespace tag
    compact: { max_string: 200, max_items: 10 }
  - id: memory.associate
    tool: associate_memories
    risk: reversible
    requires_capability: operations:store
    constraints: [namespaces, calls_per_run]
    guards: [memory_ownership]       # both memories must carry one of the grant's namespace tags
  - id: memory.health
    tool: check_database_health
    risk: read
    constraints: [calls_per_run]

# Policy for `wp-mcp-router` (tools discovered at runtime). wp_run_across (fan-out to many sites) reaches
# owner clients; an agent needs the `run_across` operation explicitly.
connector: wp-mcp-router
version: 3
adapter_version: "2.0"
tool_transforms: [narrow_site_enum]   # the `site` enum shows only the grant's sites
site_hosts_tool: wp_list_sites        # learned at connect time for URL policy
operations:
  # Specific wp_run operations first: the ability name selects the operation.
  - id: wordpress.content.read
    tool: wp_run
    match: { ability_name: "^(core/(get-post|list-posts|get-site-info|list-post-types|get-taxonomy|list-terms|get-term|get-media|list-media|get-user|list-users)|[a-z0-9-]+/(get|list|search|find|read|render|analyze|preview|check)-[a-z0-9-]+)$" }
    risk: read
    requires_capability: operations:content.read
    constraints: [sites, calls_per_run]
    guards: [compact_request]
    response: [site_result]
    compact: { fields: [id, status, type, title, link, modified, date, slug] }
  - id: wordpress.content.draft
    tool: wp_run
    match: { ability_name: "^(core/(create-post|update-post)|[a-z0-9-]+/(create|update)-(post|page|guide|draft)[a-z0-9-]*)$" }
    risk: reversible
    requires_capability: operations:content.draft
    constraints: [sites, post_types, max_drafts_per_run, calls_per_run]
    guards: [force_draft_status, compact_request]
    response: [site_result]
    compact: { fields: [id, status, type, title, link, modified, slug] }
  - id: wordpress.run_across
    tool: wp_run_across
    risk: sensitive
    requires_capability: operations:run_across
    constraints: [calls_per_run]
  - id: wordpress.site.read
    tool: wp_list_sites
    risk: read
    requires_capability: operations:content.read
    constraints: [sites_filter, calls_per_run]
  - id: wordpress.abilities.search
    tool: wp_search_abilities
    risk: read
    requires_capability: operations:content.read
    constraints: [sites_filter, calls_per_run]
  - id: wordpress.abilities.describe
    tool: wp_get_ability
    risk: read
    requires_capability: operations:content.read
    constraints: [sites, calls_per_run]
  - id: wordpress.content.read_url
    tool: wp_get_content_by_url
    risk: read
    requires_capability: operations:content.read
    constraints: [sites_url, calls_per_run]
    response: [site_result]
    compact: { fields: [id, status, type, title, link, modified, date, slug, site] }

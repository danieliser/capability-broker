# ~/.brokerd/connectors.yaml: every MCP server the broker runs. Hot-reloaded within 2 seconds.
#
# Quickest start: let the broker move in the servers your apps already have:
#   brokerd client adopt <server> --dry-run      # see the definition first
#   brokerd client adopt <server>
#
# Or add servers by hand below. Keys go in ~/.brokerd/secrets.json (`brokerd secret set NAME`) and are referenced
# as ${secret:NAME}; ${env:NAME} reads the broker's environment. A server whose secret is missing is skipped and
# shown in `brokerd status`; the others keep running.
#
# Tools are discovered from each server and passed through unchanged. For agents, policy comes from the
# connector's catalog (~/.brokerd/catalog.d/<name>.yaml, an embedded one, or a synthesized one in which every tool
# is an operation of its own name that an agent grant must list).

connectors: {}

# Examples (uncomment under `connectors:` and remove the `{}`):
#
# connectors:
#   # A local server run by npx or uvx (pinned to one installed version automatically).
#   github:
#     command: npx
#     args: [-y, "@modelcontextprotocol/server-github"]
#     env:
#       GITHUB_PERSONAL_ACCESS_TOKEN: "${secret:GITHUB_TOKEN}"
#
#   # A database, read-only, started only when a call needs it.
#   clickhouse:
#     command: uvx
#     args: [--from, mcp-clickhouse, mcp-clickhouse]
#     env:
#       CLICKHOUSE_HOST: localhost
#       CLICKHOUSE_USER: readonly
#       CLICKHOUSE_PASSWORD: "${secret:CLICKHOUSE_PASSWORD}"
#       CLICKHOUSE_DATABASE: analytics
#     on_demand: true              # not started until called; tools listed from cache
#     idle_stop: 10m               # stopped again after 10 quiet minutes
#
#   # A remote server with an API key header.
#   hosting:
#     url: https://mcp.example-host.com/mcp/
#     headers:
#       X-Api-Key: "${secret:HOSTING_API_KEY}"
#
#   # A remote server the broker signs in to with OAuth (run `brokerd auth vercel` once).
#   vercel:
#     url: https://mcp.vercel.com/
#     oauth: {}
#
#   # n8n instance management: Streamable HTTP, owner tools/results unchanged.
#   # Import Keychain n8n-mcp-token via `brokerd secret set N8N_MCP_TOKEN` (stdin).
#   # Agent workflow tools use a separate n8n-flows connector/catalog: docs/n8n.md.
#   n8n:
#     url: http://127.0.0.1:5678/mcp-server/http
#     headers:
#       Authorization: "Bearer ${secret:N8N_MCP_TOKEN}"
#     owner_only: true
#     expose: passthrough
#     clients: [claude-code, codex]
#
#   # Personal data: your own apps only, never granted to agents.
#   gmail-work:
#     command: gog
#     args: [--account, work, --readonly, mcp, --allow-tool, gmail]
#     owner_only: true
#
#   # A big tool list kept out of every chat's context: found through search_tools / call_tool when needed.
#   metabase:
#     command: uv
#     args: [--directory, ~/mcp/metabase, run, server.py]
#     expose: broker
#     clients: [claude-code, codex]        # only these apps (or [!cursor] to leave one out)
#     tools: { exclude: ["delete_*"] }     # hidden and refused for every caller
#     strip: [outputSchema, meta]          # parts of tool definitions or results apps do not need
#     response:                            # reshape results for every caller
#       drop_keys: [_links, debug]
#       max_chars: 20000
#       command: [jq, -c, "."]             # an external filter: result JSON in, result JSON or text out

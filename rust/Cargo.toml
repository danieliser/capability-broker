[package]
name = "brokerd-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
regex = "1"
rmcp = { version = "3.8", default-features = false, features = ["client", "server", "transport-child-process", "transport-streamable-http-server"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "process"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
